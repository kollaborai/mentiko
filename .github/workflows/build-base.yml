# build mentiko-base — multi-arch (amd64 + arm64) tools image.
#
# this workflow builds Dockerfile.base on both arches in parallel using
# free GitHub-hosted runners (ubuntu-latest for amd64, ubuntu-24.04-arm
# for arm64 — both free for public repos), then publishes a fat manifest
# under :<commit-sha> AND :latest.
#
# the resulting image is consumed by this repo's Dockerfile
# (via FROM ...mentiko-base:${BASE_TAG}).
#
# rebuild triggers:
#   - push to Dockerfile.base on main
#   - weekly cron (mondays 04:00 UTC) — picks up upstream tool updates
#   - manual workflow_dispatch
#
# ONE-TIME SETUP (after the first successful run):
#   1. visit https://github.com/orgs/kollaborai/packages/container/mentiko-base/settings
#   2. change "Package visibility" from Private to Public
#   3. link the package to this repo so it appears in the repo packages list
#   subsequent pushes preserve public visibility automatically.

name: build mentiko-base

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.base'
      - '.github/workflows/build-base.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kollaborai/mentiko-base

jobs:
  base-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,scope=base-amd64,mode=max

  base-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=base-arm64
          cache-to: type=gha,scope=base-arm64,mode=max

  manifest:
    needs: [base-amd64, base-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create + push manifest :${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64
      - name: create + push manifest :latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64
      - name: write summary
        run: |
          {
            echo "## mentiko-base built"
            echo ""
            echo "**SHA tag:**  \`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo "**latest:**   \`${{ env.IMAGE }}:latest\`"
            echo ""
            echo "to pin a consumer to this build:"
            echo ""
            echo "    FROM ${{ env.IMAGE }}:${{ github.sha }}"
            echo ""
            echo "or via build-arg in this repo's Dockerfile:"
            echo ""
            echo "    docker build --build-arg BASE_TAG=${{ github.sha }} ."
          } >> "$GITHUB_STEP_SUMMARY"
