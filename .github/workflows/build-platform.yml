# build mentiko (platform image) — multi-arch (amd64 + arm64).
#
# this builds the full mentiko platform image — the one self-hosters run
# directly via `docker pull ghcr.io/kollaborai/mentiko:<tag>`. The platform
# image inherits its tools layer FROM ghcr.io/kollaborai/mentiko-base
# (built separately by build-base.yml).
#
# pipeline shape:
#   validate -> build-js (amd64 only, once) -> platform-{amd,arm}64
#     (download artifact, skip in-image webpack, assemble) ->
#     smoke-test matrix -> manifest
#
# build-js builds the next.js standalone bundle ONCE on amd64 and the
# two per-arch jobs share it. saves ~4 min of duplicate webpack work
# on the arm64 build path. native deps are still installed per-arch in
# the runtime stage of the Dockerfile so the bundle stays JS-only.
#
# trigger model: explicit releases only.
#   every run, per-arch jobs push to a run-scoped staging tag:
#     :staging-<run_id>-amd64
#     :staging-<run_id>-arm64
#   these are pre-smoke artifacts. nothing pinned to them in production.
#
#   - push a strict patch tag (e.g. `git tag v0.3.11 && git push --tags`):
#     after smoke passes, manifest job promotes the two staging refs into
#     multi-arch :<commit-sha>, :<tag>, and :latest.
#   - manual workflow_dispatch from the Actions UI: smoke runs against the
#     staging refs and the run reports green/red, but NO release-looking
#     manifest (:<sha>, :latest, :vX.Y.Z) is created or moved. that gives
#     us a real dry-run path for validating CI without mutating what
#     self-hosters pull.
#
# rationale: the platform image is heavy (1500+ npm packages, next.js build,
# native compile). building on every push to main would be wasteful. tags
# represent intentional releases — what tenants and self-hosters pull.
#
# ONE-TIME SETUP (after the first successful run):
#   1. visit https://github.com/orgs/kollaborai/packages/container/mentiko/settings
#   2. change "Package visibility" from Private to Public
#   3. link the package to this repo so it appears in the repo packages list
#   subsequent pushes preserve public visibility automatically.
#
#   ALSO, after the first run that pushes to mentiko-cache:
#   1. visit https://github.com/orgs/kollaborai/packages/container/mentiko-cache/settings
#   2. set "Package retention" to "Delete after 14 days" (or similar) —
#      registry-backed buildx caches accumulate ~1-2 GB per arch otherwise.
#      the cache rebuilds automatically when missing, so dropping it is safe.
#   3. (optional) keep package visibility Private. it leaks no secrets but
#      there's no reason for the public to pull a buildkit cache image.

name: build mentiko platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'mentiko-base tag to build against (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kollaborai/mentiko

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: validate release version
        run: node scripts/validate-platform-release-version.mjs

  # phase 4: run next.js webpack build ONCE on amd64 and share the
  # standalone output with both per-arch jobs as a workflow artifact.
  # the bundle is pure javascript (next-bundled native deps get
  # reinstalled per-arch in the runtime stage). saves the ~4 min of
  # webpack work on the arm64 job which otherwise duplicates this.
  build-js:
    needs: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: next build (webpack)
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          ./node_modules/.bin/next build --webpack
          test -f .next/standalone/server.js || { echo "FATAL: standalone build missing server.js"; exit 1; }
      - name: upload .next standalone + static
        uses: actions/upload-artifact@v4
        with:
          name: mentiko-next-build-${{ github.run_id }}
          path: |
            web/.next/standalone
            web/.next/static
          retention-days: 1
          if-no-files-found: error
          # CRITICAL: include-hidden-files defaults to false in v4. our
          # standalone bundle has web/.next/standalone/.next/* (a hidden
          # subdir holding BUILD_ID + server/ + manifests). without this
          # flag, the upload silently drops everything under .next/ and
          # the platform image boots with "Could not find a production
          # build in the './.next' directory" — caught the hard way by
          # the v0.3.19 release attempt.
          include-hidden-files: true
          # disable compression — the bundle is mostly already-compressed
          # js chunks and re-compressing burns CI time for no gain.
          compression-level: 0

  platform-amd64:
    needs: [validate-release-version, build-js]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.refs.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: download next.js build artifact
        uses: actions/download-artifact@v4
        with:
          name: mentiko-next-build-${{ github.run_id }}
          path: web/.next
      - name: confirm artifact landed where Dockerfile expects
        # check BOTH the top-level standalone wrapper AND the hidden
        # .next/standalone/.next/ subdir (BUILD_ID + server/) that
        # next.js needs at runtime. the v0.3.19 release shipped without
        # this check and the .next/ subdir was missing because of
        # upload-artifact@v4's default exclusion of hidden files.
        run: |
          test -f web/.next/standalone/server.js || { echo "FATAL: artifact missing standalone/server.js"; exit 1; }
          test -d web/.next/static || { echo "FATAL: artifact missing static/"; exit 1; }
          test -f web/.next/standalone/.next/BUILD_ID || { echo "FATAL: artifact missing standalone/.next/BUILD_ID"; exit 1; }
          test -d web/.next/standalone/.next/server || { echo "FATAL: artifact missing standalone/.next/server/"; exit 1; }
      - name: compute staging image ref
        id: refs
        # every pre-smoke per-arch push goes to a run-scoped staging tag
        # rather than a release-looking :${sha}-${arch}. that way a bad
        # build doesn't leave a pullable artifact at a "looks-released"
        # path. promotion to :${sha}/:latest/:${semver} happens in the
        # manifest job after smoke passes (and only on tag pushes).
        run: |
          echo "image=${{ env.IMAGE }}:staging-${{ github.run_id }}-amd64" >> "$GITHUB_OUTPUT"
      - name: build + push amd64 (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_TAG=${{ inputs.base_tag || 'latest' }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            BUILD_REPO=kollaborai/mentiko
            SKIP_NEXT_BUILD=1
          tags: ${{ steps.refs.outputs.image }}
          # phase 5: registry-backed cache. survives across CI runs and
          # has no 10GB cap (vs gha cache which evicts aggressively).
          # the cache image (mentiko-cache:platform-amd64) is a separate
          # ghcr package — see ONE-TIME SETUP header for first-run config.
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache:platform-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache:platform-amd64,mode=max

  platform-arm64:
    needs: [validate-release-version, build-js]
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.refs.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: download next.js build artifact
        uses: actions/download-artifact@v4
        with:
          name: mentiko-next-build-${{ github.run_id }}
          path: web/.next
      - name: confirm artifact landed where Dockerfile expects
        # check BOTH the top-level standalone wrapper AND the hidden
        # .next/standalone/.next/ subdir (BUILD_ID + server/) that
        # next.js needs at runtime. the v0.3.19 release shipped without
        # this check and the .next/ subdir was missing because of
        # upload-artifact@v4's default exclusion of hidden files.
        run: |
          test -f web/.next/standalone/server.js || { echo "FATAL: artifact missing standalone/server.js"; exit 1; }
          test -d web/.next/static || { echo "FATAL: artifact missing static/"; exit 1; }
          test -f web/.next/standalone/.next/BUILD_ID || { echo "FATAL: artifact missing standalone/.next/BUILD_ID"; exit 1; }
          test -d web/.next/standalone/.next/server || { echo "FATAL: artifact missing standalone/.next/server/"; exit 1; }
      - name: compute staging image ref
        id: refs
        run: |
          echo "image=${{ env.IMAGE }}:staging-${{ github.run_id }}-arm64" >> "$GITHUB_OUTPUT"
      - name: build + push arm64 (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE_TAG=${{ inputs.base_tag || 'latest' }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            BUILD_REPO=kollaborai/mentiko
            SKIP_NEXT_BUILD=1
          tags: ${{ steps.refs.outputs.image }}
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache:platform-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache:platform-arm64,mode=max

  smoke-test:
    # runs after the per-arch images are pushed but BEFORE the manifest
    # job promotes them to :latest. blocks bad images from ever landing
    # on what self-hosters pull. matrixed on native runners per arch
    # because there is no setup-qemu in this workflow — arm64 docker
    # cannot run on ubuntu-latest without it.
    needs: [platform-amd64, platform-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: ${{ needs.platform-amd64.outputs.image }}
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ${{ needs.platform-arm64.outputs.image }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke ${{ matrix.arch }}
        run: |
          # mount the script INTO /opt/mentiko so node resolves require()
          # against the bundle's node_modules. mounting at /tmp would put
          # the script outside the resolution path and every require fails
          # with "Cannot find module 'ws'" etc.
          docker run --rm \
            -v "$PWD/scripts/smoke-platform-image.cjs:/opt/mentiko/smoke.cjs:ro" \
            ${{ matrix.image }} \
            node /opt/mentiko/smoke.cjs

  manifest:
    needs: [platform-amd64, platform-arm64, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive semver tag (when triggered by a tag push)
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "semver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "has_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_semver=false" >> "$GITHUB_OUTPUT"
          fi
      - name: create + push manifest :${{ github.sha }} (tag builds only)
        # promote the staging refs to a release-looking :${sha} multi-arch
        # alias only after smoke passed. on workflow_dispatch the staging
        # refs remain reachable by their run-scoped name only.
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ needs.platform-amd64.outputs.image }} \
            ${{ needs.platform-arm64.outputs.image }}
      - name: create + push manifest :latest (tag builds only)
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ needs.platform-amd64.outputs.image }} \
            ${{ needs.platform-arm64.outputs.image }}
      - name: create + push manifest :${{ steps.tag.outputs.semver }} (tag builds only)
        if: steps.tag.outputs.has_semver == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ steps.tag.outputs.semver }} \
            ${{ needs.platform-amd64.outputs.image }} \
            ${{ needs.platform-arm64.outputs.image }}
      - name: write summary
        run: |
          {
            echo "## mentiko platform built"
            echo ""
            echo "**staging amd64:** \`${{ needs.platform-amd64.outputs.image }}\`"
            echo "**staging arm64:** \`${{ needs.platform-arm64.outputs.image }}\`"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo ""
              echo "**SHA tag:**  \`${{ env.IMAGE }}:${{ github.sha }}\`"
              echo "**latest:**   \`${{ env.IMAGE }}:latest\`"
              if [ "${{ steps.tag.outputs.has_semver }}" = "true" ]; then
                echo "**semver:**   \`${{ env.IMAGE }}:${{ steps.tag.outputs.semver }}\`"
              fi
              echo ""
              echo "to pull this release:"
              echo ""
              echo "    docker pull ${{ env.IMAGE }}:latest"
            else
              echo ""
              echo "this was a workflow_dispatch run. only the staging refs above"
              echo "were pushed; \`:latest\`, \`:<sha>\`, and \`:vX.Y.Z\` were NOT updated."
            fi
            echo ""
            echo "**built FROM:** \`ghcr.io/kollaborai/mentiko-base:${{ inputs.base_tag || 'latest' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: dispatch control-plane tenant build
        if: steps.tag.outputs.has_semver == 'true'
        env:
          CONTROL_PLANE_DISPATCH_TOKEN: ${{ secrets.CONTROL_PLANE_DISPATCH_TOKEN }}
          SEMVER: ${{ steps.tag.outputs.semver }}
        run: |
          if [ -z "$CONTROL_PLANE_DISPATCH_TOKEN" ]; then
            echo "CONTROL_PLANE_DISPATCH_TOKEN is required for tag releases"
            echo "Create a fine-grained token that can dispatch workflows in kollaborai/mentiko-control-plane."
            exit 1
          fi

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONTROL_PLANE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kollaborai/mentiko-control-plane/dispatches \
            -d "$(jq -nc \
              --arg ref "$SEMVER" \
              --arg version "$SEMVER" \
              --arg sha "${{ github.sha }}" \
              '{event_type:"platform-release", client_payload:{ref:$ref, version:$version, sha:$sha}}')"

          echo "dispatched control-plane platform-release for $SEMVER"
