# mentiko platform - self-hosted production deployment
#
# usage:
#   cp .env.example .env        # edit with your settings
#   docker compose -f docker-compose.production.yml up -d
#   open http://localhost:3000
#
# data persists in the mentiko-data volume at /app inside the container.
# to back up: docker run --rm -v mentiko-data:/app -v $(pwd):/backup alpine tar czf /backup/mentiko-backup.tar.gz /app
#
# for HTTPS: put a reverse proxy (caddy, nginx, traefik) in front of port 3000.
# the terminal websocket is on port 3099 -- proxy that too if you need browser terminal.

services:
  mentiko:
    build: .
    restart: unless-stopped
    # Container internals are fixed at 3000 / 3099 (next.js + ws-terminal
    # readiness probes are hardcoded). Use these env vars to remap the HOST
    # side of the mapping only. For different container-internal ports you
    # need a reverse proxy in front of the container (see MENTIKO_TERMINAL_PROXY).
    ports:
      - "${PORT:-3000}:3000"
      - "${WS_PORT:-3099}:3099"
    volumes:
      - mentiko_data:/app
    environment:
      # auth (required)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATABASE_URL: file:/app/data/auth.db
      # runtime
      NODE_ENV: production
      MENTIKO_GLOBAL_ROOT: /app
      MENTIKO_CODE_ROOT: /opt/mentiko
      NAMESPACE_ID: default
      # terminal ws bridge — the public-facing port the browser will hit.
      # Matches the host side of the port mapping above. The container's
      # internal ws-terminal listener stays on 3099.
      WS_PORT: ${WS_PORT:-3099}
      # set MENTIKO_TERMINAL_PROXY=true if fronted by a reverse proxy that
      # routes /ws/terminal to the container's port 3099.
      MENTIKO_TERMINAL_PROXY: ${MENTIKO_TERMINAL_PROXY:-}
      WS_TERMINAL_PROXY_PATH: ${WS_TERMINAL_PROXY_PATH:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      # admin bootstrap (comma-separated emails that get admin role on first login)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # AI provider keys are managed in the secrets vault UI (/settings/secrets)
      # OAuth providers (optional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # email delivery (optional — pick Resend OR generic SMTP; Resend wins if both set)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # error monitoring (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

volumes:
  mentiko_data:
    name: mentiko-data
